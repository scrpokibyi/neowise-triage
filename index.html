<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #status:empty { display: none; }
    #status { padding: .6rem .8rem; border-radius: .4rem; background: #f1f3f5; }
    #status[data-kind="manual_review"], #status[data-kind="invalid"] { background: #fff4e5; color: #7a4100; }
    .hint { color: #555; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form novalidate>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="output" hidden>
    <p><strong>Тема:</strong> <span id="topic"></span></p>
    <label for="draft">Черновик ответа</label>
    <textarea id="draft" rows="6"></textarea>
    <p class="hint">Проверьте и при необходимости отредактируйте черновик перед отправкой клиенту.</p>
  </section>

  <script type="module">
    import { toView, render, LOADING_VIEW } from "/ui.mjs";

    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const message = document.querySelector("#message");
    const els = {
      status: document.querySelector("#status"),
      topic: document.querySelector("#topic"),
      draft: document.querySelector("#draft"),
      output: document.querySelector("#output"),
    };

    let lastRequestId = 0;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = message.value;

      if (text.trim() === "") {
        render(toView(400, { status: "invalid_input" }), els);
        return;
      }

      const requestId = ++lastRequestId;
      render(LOADING_VIEW, els); // сразу убираем прошлый черновик
      button.disabled = true;

      let view;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: AbortSignal.timeout(5000),
        });
        const body = await reply.json().catch(() => null);
        view = toView(reply.status, body);
      } catch {
        view = toView(0, null);
      }

      if (requestId !== lastRequestId) return; // пришёл ответ на устаревший запрос
      render(view, els);
      button.disabled = false;
    });
  </script>
</body>
</html>
